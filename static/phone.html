<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<title>CamaraWeb</title>
<link rel="stylesheet" href="style.css">
<style>
  body.phone { background: #000; color: #fff; min-height: 100dvh; display: flex; flex-direction: column;
                align-items: center; justify-content: center; margin: 0; padding: 24px; gap: 20px; }
  body.phone .wrap { max-width: none; padding: 0; width: 100%; }
  body.phone header, body.phone .card, body.phone .log, body.phone .kv { display: none; }
  .dot-big { width: 74px; height: 74px; border-radius: 50%; background: #2a2a2a; display: grid; place-items: center; }
  .dot-big.on { background: #1f6f2e; animation: halo 1.8s ease-out infinite; }
  .dot-big.err { background: #6f1f1f; animation: none; }
  .dot-big span { width: 26px; height: 26px; border-radius: 50%; background: #fff; display: block; }
  @keyframes halo { 0% { box-shadow: 0 0 0 0 #1f6f2e88; } 100% { box-shadow: 0 0 0 34px #1f6f2e00; } }
  .msg-main { font-size: 21px; font-weight: 600; text-align: center; margin: 0; }
  .msg-sub { font-size: 15px; color: #9a9a9a; text-align: center; margin: 0; max-width: 320px; line-height: 1.45; }
  .btn-pedir { font-size: 17px; font-weight: 600; padding: 18px 30px; border: 0; border-radius: 12px;
               background: #fff; color: #000; cursor: pointer; }
  .btn-pedir:disabled { opacity: .5; }
  .btn-parar { font-size: 15px; font-weight: 500; padding: 13px 26px; border: 1px solid #333; border-radius: 10px;
               background: transparent; color: #bbb; cursor: pointer; }
  .btn-parar:active { background: #1a1a1a; }
  video.preview { width: 108px; height: 162px; object-fit: cover; border-radius: 10px;
                  transform: scaleX(-1); background: #111; display: none; }
  video.preview.on { display: block; }
</style>
</head>
<body class="phone">
<div class="wrap">
  <div class="dot-big" id="dot"><span></span></div>
  <p class="msg-main" id="msg-main">Conectando…</p>
  <p class="msg-sub" id="msg-sub">Espera un momento</p>
  <video class="preview" id="video" autoplay playsinline muted></video>
  <button class="btn-pedir" id="btn-start">Activar mi cámara</button>
  <button class="btn-parar" id="btn-stop" style="display:none">Detener</button>
</div>
<script src="common.js"></script>
<script src="phone.js"></script>
</body>
</html>
